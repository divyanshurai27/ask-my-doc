name: Ask the Bot

on:
  workflow_dispatch:
    inputs:
      question:
        description: 'What do you want to ask your documents?'
        required: true
        type: string

jobs:
  ask-bot:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Cache HuggingFace Models
      uses: actions/cache@v3
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-hf-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-hf-
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Ask My Docs Bot
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        LLM_PROVIDER: groq
        LLM_MODEL: llama-3.1-8b-instant
      run: |
        echo "============================================================"
        echo "QUESTION: ${{ github.event.inputs.question }}"
        echo "============================================================"
        python scripts/demo.py "${{ github.event.inputs.question }}"
